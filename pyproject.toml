[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "si-thickness"
version = "1.0.0"
description = "半导体薄膜厚度光学测量分析系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "openpyxl>=3.0.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.26.0,<2.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.0",
    "fpdf2>=2.7.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/si"]

[project.scripts]
si-api = "si.main:start"
